<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Tema antes da pintura: escolha salva ou claro (padrão do site).
    try { if (localStorage.getItem("nq:theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <title{{titlePt}}>{{seoTitle}} | Nícolas de Queiróz</title>
  <meta name="description" content="{{description}}"{{descriptionPt}}>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/site/favicon.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/site/web-clip.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:wght@400&display=swap">
  <link rel="stylesheet" href="../../css/generated.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/cursor.css">
  <link rel="stylesheet" href="../../css/nav.css">
  <link rel="stylesheet" href="../../css/work.css">
  <link rel="stylesheet" href="../../css/transitions.css">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta property="og:site_name" content="Nícolas de Queiróz">
  <meta property="og:title" content="{{seoTitle}} | Nícolas de Queiróz"{{titlePtContent}}>
  <meta property="og:description" content="{{description}}"{{descriptionPt}}>
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogAlt}}"{{ogAltPt}}>
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{seoTitle}} | Nícolas de Queiróz"{{titlePtContent}}>
  <meta name="twitter:description" content="{{description}}"{{descriptionPt}}>
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="twitter:image:alt" content="{{ogAlt}}"{{ogAltPt}}>
  <script type="application/ld+json">{{jsonLd}}</script>
</head>
<body class="min-h-[100%] antialiased font-dm-sans tracking-[0.025em] work-page">
  <nav id="site-nav" class="nav--enter-pending" aria-label="Main navigation" data-pt-aria-label="Navegação principal">
    <a href="../../" class="bubble-logo" aria-label="Nícolas de Queiróz — home" data-pt-aria-label="Nícolas de Queiróz — início">
      <span class="site-nav-logo">Nícolas de Queiróz</span>
    </a>
    <div class="nav-actions">
      <button class="bubble-toggle bubble-lang" type="button" data-lang-toggle
              aria-label="Mudar para português" aria-pressed="false">
        <span class="lang-knob" aria-hidden="true"></span>
        <span class="lang-opt" aria-hidden="true"><svg class="lang-flag" viewBox="0 0 24 24"><clipPath id="lf-us"><circle cx="12" cy="12" r="12"/></clipPath><g clip-path="url(#lf-us)"><rect width="24" height="24" fill="#fff"/><path fill="#d22f3a" d="M0 0h24v3.4H0zm0 6.9h24v3.4H0zm0 6.9h24v3.4H0zm0 6.9h24V24H0z"/><rect width="12.5" height="10.3" fill="#2b3b82"/><g fill="#fff"><circle cx="3" cy="2.6" r=".7"/><circle cx="6.2" cy="2.6" r=".7"/><circle cx="9.4" cy="2.6" r=".7"/><circle cx="4.6" cy="5.2" r=".7"/><circle cx="7.8" cy="5.2" r=".7"/><circle cx="3" cy="7.8" r=".7"/><circle cx="6.2" cy="7.8" r=".7"/><circle cx="9.4" cy="7.8" r=".7"/></g></g></svg></span>
        <span class="lang-opt" aria-hidden="true"><svg class="lang-flag" viewBox="0 0 24 24"><clipPath id="lf-br"><circle cx="12" cy="12" r="12"/></clipPath><g clip-path="url(#lf-br)"><rect width="24" height="24" fill="#1f9a4b"/><path d="M12 3.6 21.4 12 12 20.4 2.6 12Z" fill="#f7d437"/><circle cx="12" cy="12" r="4.4" fill="#25459a"/><path d="M7.8 11.1c2.8-.7 5.6-.2 8.4 1.6" stroke="#fff" stroke-width=".9" fill="none"/></g></svg></span>
      </button>
      <button class="bubble-toggle bubble-theme" id="theme-toggle" type="button"
              aria-label="Turn on dark mode" aria-pressed="false">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
        </svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="bubble-toggle" id="nav-toggle" type="button"
              aria-label="Open menu" aria-expanded="false" aria-controls="nav-overlay">
        <span class="menu-line" aria-hidden="true"></span>
        <span class="menu-line" aria-hidden="true"></span>
      </button>
    </div>
  </nav>

  <div id="nav-overlay" class="nav-overlay" aria-hidden="true">
    <ul class="nav-pill-list" aria-label="Navigation links" data-pt-aria-label="Links de navegação">
      <li class="nav-pill-col">
        <a href="../../sobre/" class="nav-pill-link" data-rotation="-8">
          <span class="nav-pill-label" data-pt="sobre">about</span>
        </a>
      </li>
      <li class="nav-pill-col">
        <a href="../../trabalhos/" class="nav-pill-link" data-rotation="8">
          <span class="nav-pill-label" data-pt="trabalhos">work</span>
        </a>
      </li>
      <li class="nav-pill-col">
        <a href="../../feed/" class="nav-pill-link" data-rotation="8">
          <span class="nav-pill-label">feed</span>
        </a>
      </li>
      <li class="nav-pill-col">
        <a href="../../contato/" class="nav-pill-link" data-rotation="-8">
          <span class="nav-pill-label" data-pt="contato">contact</span>
        </a>
      </li>
      <li class="nav-pill-col nav-lang-col">
        <button class="bubble-toggle bubble-lang bubble-lang--menu" type="button" data-lang-toggle
              aria-label="Mudar para português" aria-pressed="false">
        <span class="lang-knob" aria-hidden="true"></span>
        <span class="lang-opt" aria-hidden="true"><svg class="lang-flag" viewBox="0 0 24 24"><clipPath id="lf-us2"><circle cx="12" cy="12" r="12"/></clipPath><g clip-path="url(#lf-us2)"><rect width="24" height="24" fill="#fff"/><path fill="#d22f3a" d="M0 0h24v3.4H0zm0 6.9h24v3.4H0zm0 6.9h24v3.4H0zm0 6.9h24V24H0z"/><rect width="12.5" height="10.3" fill="#2b3b82"/><g fill="#fff"><circle cx="3" cy="2.6" r=".7"/><circle cx="6.2" cy="2.6" r=".7"/><circle cx="9.4" cy="2.6" r=".7"/><circle cx="4.6" cy="5.2" r=".7"/><circle cx="7.8" cy="5.2" r=".7"/><circle cx="3" cy="7.8" r=".7"/><circle cx="6.2" cy="7.8" r=".7"/><circle cx="9.4" cy="7.8" r=".7"/></g></g></svg></span>
        <span class="lang-opt" aria-hidden="true"><svg class="lang-flag" viewBox="0 0 24 24"><clipPath id="lf-br2"><circle cx="12" cy="12" r="12"/></clipPath><g clip-path="url(#lf-br2)"><rect width="24" height="24" fill="#1f9a4b"/><path d="M12 3.6 21.4 12 12 20.4 2.6 12Z" fill="#f7d437"/><circle cx="12" cy="12" r="4.4" fill="#25459a"/><path d="M7.8 11.1c2.8-.7 5.6-.2 8.4 1.6" stroke="#fff" stroke-width=".9" fill="none"/></g></svg></span>
      </button>
      </li>
    </ul>
  </div>

  <main class="work-main">
    {{hero}}
    <div class="work-body">
      {{intro}}
      {{blocks}}
      {{outro}}
      {{nextCase}}
    </div>
    <noscript>
      <p class="work-noscript">
        <a href="../../">← Back to portfolio</a> · {{title}}
      </p>
    </noscript>
  </main>

  <footer>
    <span class="site-copyright">© {{year}} Nícolas de Queiróz</span>
    <a href="../../" class="back-home bubble-back-home" aria-label="Back to home" data-pt-aria-label="Voltar para o início">
      <svg class="back-home-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span data-pt="Início">Home</span>
    </a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="../../js/i18n.js" defer></script>
  <script src="../../js/view-transitions.js" defer></script>
  <script src="../../js/theme.js" defer></script>
  <script src="../../js/nav.js" defer></script>
  <script src="../../js/nav-enter.js" defer></script>
  <script src="../../js/nav-theme.js" defer></script>
  <script src="../../js/cursor.js" defer></script>
  <script src="../../js/reveal.js" defer></script>
  <script src="../../js/next-video.js" defer></script>
</body>
</html>
