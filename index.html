  <script type="application/json" id="works-data">{"site":{"name":"Nícolas de Queiróz","title":"Nícolas de Queiróz — Branding e Web Design","description":"Crio marcas, interfaces e sites de alta performance, do conceito ao lançamento.","url":"https://www.nicolasdequeiroz.com","ogImage":"assets/site/og-home.jpg"},"works":[{"slug":"mizzu-sushi","title":"Mizzu Sushi","tagline":"O oceano em sua mesa.","description":"Identidade visual para um restaurante japonês em Siqueira Campos, no interior do Paraná. O nome parte de mizu (水), água em japonês: a ligação entre a água e os frutos do mar, base da gastronomia japonesa, guia a marca. Uma adaptação da Grande Onda de Kanagawa (Hokusai, 1830) evoca a herança japonesa e traz a energia do oceano para cada aplicação.","year":2024,"services":["Identidade visual","Embalagens"],"industry":"Restaurante japonês","location":"Siqueira Campos, PR","thumb":"assets/works/mizzu-sushi/hero.webp","hero":{"type":"image","src":"assets/works/mizzu-sushi/hero.webp","mobile":"assets/works/mizzu-sushi/hero-mobile.webp","alt":"Logotipo do Mizzu Sushi sobre a Grande Onda em vermelho escuro"},"blocks":[{"type":"image","src":"assets/works/mizzu-sushi/assinaturas.webp","alt":"Quatro versões do logotipo do Mizzu Sushi em vermelho, preto, creme e branco","ratio":"16:9","caption":"Assinaturas"},{"type":"text","label":"Conceito","text":"Mizu (水) significa água. A palavra virou o ponto de partida: a água como elo entre o oceano e o prato. O ideograma assume o papel de símbolo, a tipografia serifada com espaçamento largo traz a calma da tradição, e o vermelho com o marrom quase preto remetem à laca e à cerâmica japonesas."},{"type":"video","src":"assets/works/mizzu-sushi/selo.mp4","poster":"assets/works/mizzu-sushi/selo-poster.webp","alt":"Selo circular do Mizzu Sushi girando sobre padrão de ondas","ratio":"16:9","caption":"Selo"},{"type":"pair","items":[{"src":"assets/works/mizzu-sushi/poster.webp","alt":"Pôster vermelho com a Grande Onda em um cavalete","caption":"Pôster"},{"src":"assets/works/mizzu-sushi/mizu-agua.webp","alt":"Ideograma 水 com as palavras Mizu e Água","caption":"水 · Água"}]},{"type":"statement","text":"Uma onda de 1830 como assinatura."},{"type":"image","src":"assets/works/mizzu-sushi/embalagem.webp","alt":"Bandeja de sushi com cinta vermelha do Mizzu, molho shoyu e hashis","ratio":"16:9","caption":"Embalagem"},{"type":"text","label":"Aplicações","text":"O sistema se estende por todo o contato com o cliente: cinta das bandejas de delivery, envelope do hashi, ecobag, cartão, uniforme e o perfil no Instagram. Em cada peça, a onda e o selo aparecem com parcimônia, deixando o vermelho fazer o trabalho."},{"type":"pair","items":[{"src":"assets/works/mizzu-sushi/ecobag.webp","alt":"Ecobag de algodão com a Grande Onda em vermelho","caption":"Ecobag"},{"src":"assets/works/mizzu-sushi/instagram.webp","alt":"Perfil do Mizzu Sushi no Instagram em um celular","caption":"Instagram"}]},{"type":"image","src":"assets/works/mizzu-sushi/hashi.webp","alt":"Hashis em envelope vermelho do Mizzu sobre prato preto","ratio":"4:3","caption":"Hashi"},{"type":"image","src":"assets/works/mizzu-sushi/cartao.webp","alt":"Cartão preto do Mizzu entre flores de cerejeira","ratio":"4:3","caption":"Cartão"},{"type":"image","src":"assets/works/mizzu-sushi/camiseta.webp","alt":"Camiseta branca com o logotipo do Mizzu Sushi","ratio":"16:9","caption":"Uniforme"},{"type":"image","src":"assets/works/mizzu-sushi/embalagem-2.webp","alt":"Bandeja de sushis variados com a cinta do Mizzu","ratio":"16:9"}],"credits":[{"role":"Design e aplicações","name":"Nícolas de Queiróz"},{"role":"Briefing","name":"Matheus Morita"}]},{"slug":"jabutibar","title":"JabutiBar","tagline":"Um oásis de descontração no interior paulista.","description":"Identidade visual para um bar ao ar livre em Itaporanga, no interior de São Paulo. O JabutiBar celebra a vida ao ar livre, a comida e a bebida de qualidade e a cultura local. A marca nasce da natureza que cerca o lugar e da atmosfera leve do interior paulista, traduzindo uma filosofia de acolhimento e celebração.","year":2024,"services":["Identidade visual","Ilustração","Cardápio"],"industry":"Bar e lounge","location":"Itaporanga, SP","thumb":"assets/works/jabutibar/hero.webp","hero":{"type":"image","src":"assets/works/jabutibar/hero.webp","mobile":"assets/works/jabutibar/hero-mobile.webp","alt":"Kombi verde com o jabuti do JabutiBar estacionada entre árvores"},"blocks":[{"type":"image","src":"assets/works/jabutibar/ilustracao.webp","alt":"Logotipo do JabutiBar com o jabuti, emoldurado por folhagens ilustradas","ratio":"16:9"},{"type":"text","label":"Conceito","text":"Um lugar onde as preocupações somem na brisa e as risadas ecoam entre as árvores. O jabuti, sem pressa, virou o símbolo desse ritmo. Verdes de folhagem, um creme de papel e um lettering arredondado dão à marca o tom descontraído do interior, e as ilustrações de folhas trazem a mata para cada peça."},{"type":"image","src":"assets/works/jabutibar/assinaturas.webp","alt":"Versões do logotipo e do selo Bar Lounge do JabutiBar em verde, creme e preto","ratio":"16:9","caption":"Assinaturas"},{"type":"pair","items":[{"src":"assets/works/jabutibar/cartao.webp","alt":"Cartão creme do JabutiBar sobre uma folha grande","caption":"Cartão"},{"src":"assets/works/jabutibar/comanda.webp","alt":"Comanda numerada do JabutiBar entre folhas","caption":"Comanda"}]},{"type":"image","src":"assets/works/jabutibar/cardapio.webp","alt":"Cardápio impresso verde com drinks ilustrados e petiscos","ratio":"16:9","caption":"Cardápio"},{"type":"image","src":"assets/works/jabutibar/cardapio-digital.webp","alt":"Telas do cardápio digital do JabutiBar com destilados","ratio":"16:9","caption":"Cardápio digital"},{"type":"statement","text":"Uma celebração da vida ao ar livre."},{"type":"image","src":"assets/works/jabutibar/posteres.webp","alt":"Dois pôsteres de drinks em uma parede coberta de hera","ratio":"16:9","caption":"Pôsteres"},{"type":"pair","items":[{"src":"assets/works/jabutibar/ecobag.webp","alt":"Ecobag do JabutiBar segurada em meio ao mato alto","caption":"Ecobag"},{"src":"assets/works/jabutibar/garrafa.webp","alt":"Garrafa com rótulo verde do JabutiBar contra o céu","caption":"Garrafa"}]},{"type":"image","src":"assets/works/jabutibar/cavalete.webp","alt":"Cavalete verde com o selo do JabutiBar ao lado de um garçom","ratio":"16:9","caption":"Cavalete"},{"type":"image","src":"assets/works/jabutibar/camiseta.webp","alt":"Camiseta creme com o logotipo do JabutiBar","ratio":"16:9","caption":"Uniforme"}],"credits":[{"role":"Ilustrações","name":"Nícolas de Queiróz e Artur Tadao Massuda"},{"role":"Design e aplicações","name":"Nícolas de Queiróz"},{"role":"Briefing","name":"Leonardo Diniz e Nelson Fiuza"}]},{"slug":"studioisa","title":"studioisa","description":"Marca e site para estúdio de pilates com foco em bem-estar e movimento.","year":2025,"services":["Branding","Web Design"],"thumb":"assets/works/studioisa/hero.webp","hero":{"type":"image","src":"assets/works/studioisa/hero.webp","mobile":"assets/works/studioisa/hero-mobile.webp","alt":"studioisa"},"blocks":[]},{"slug":"move","title":"Move+","description":"Plataforma de mobilidade urbana com identidade dinâmica e interface digital.","year":2025,"services":["Branding","Product Design"],"thumb":"assets/works/move/hero.gif","hero":{"type":"image","src":"assets/works/move/hero.gif","mobile":"assets/works/move/hero-mobile.gif","alt":"Move+"},"blocks":[]},{"slug":"topfit","title":"TOPFIT","description":"Identidade visual completa para a TOPFIT, marca conceito de suplementos de Ribeirão Preto (SP). Letras brutas e blocadas, um vermelho intenso e um ícone em forma de seta, que sobe, sustentam uma marca que vende atitude e posicionamento, do e-commerce à loja física.","year":2025,"services":["Identidade visual","E-commerce"],"thumb":"assets/works/topfit/hero.webp","hero":{"type":"image","src":"assets/works/topfit/hero.webp","mobile":"assets/works/topfit/hero-mobile.webp","alt":"Camiseta preta com a etiqueta vermelha do logotipo TOPFIT"},"blocks":[{"type":"text","label":"Sobre a marca","text":"A TOPFIT não nasceu para ser só mais uma loja de suplementos. Atua com loja física, e-commerce próprio, marketplaces e distribuição, e vende mais do que produto: vende atitude, curadoria e posicionamento. Uma marca com voz própria, provocadora, bruta, direta e autêntica."},{"type":"image","src":"assets/works/topfit/familia-logos.webp","alt":"Família de logotipos TOPFIT em vermelho: logo primária, ícone de seta, logo com slogan, box logo, versão vertical, isométrica e estilizada","ratio":"7:5","caption":"Família de logotipos"},{"type":"text","label":"Logotipo","text":"A logo é uma afirmação visual: o nome em sua forma mais pura, em letras brutas, blocadas e pesadas. Removemos até a contraforma do “O” e do “P” para intensificar a sensação de bloco, e a tipografia quase não tem espaçamento. Com essas definições, a única cor que cabia era o vermelho, por sua natureza visceral e corajosa."},{"type":"image","src":"assets/works/topfit/logotipo.webp","alt":"Logotipo TOPFIT em branco sobre degradê de vermelho a vinho, com o slogan Suplementos para você chegar ao topo","ratio":"16:9","caption":"Logotipo e slogan"},{"type":"statement","text":"Símbolos que gritam, não sussurram."},{"type":"image","src":"assets/works/topfit/icone.webp","alt":"Ícone da TOPFIT: uma seta isométrica branca sobre fundo vermelho, com linhas de construção, e aplicada em uma quina","ratio":"7:5","caption":"Ícone"},{"type":"text","label":"Ícone","text":"Construído a partir do “T” da marca, distorcido simetricamente, separado em dois blocos e inclinado em 30 graus, cria uma vista isométrica que lembra uma quina sólida. Pode ser lido como uma seta disfarçada apontando para cima, a quina de uma caixa de e-commerce ou um selo geométrico que marca território."},{"type":"image","src":"assets/works/topfit/perfil-instagram.webp","alt":"Ícone vermelho da TOPFIT, perfil do Instagram com o ícone como foto e ícone de aplicativo","ratio":"7:5","caption":"Perfil e aplicativo"},{"type":"text","label":"Cores","text":"O vermelho intenso (#C21819) é o tom principal: força, movimento e potência. Branco e cinza claro dão respiro e legibilidade, principalmente no digital, enquanto o vinho e o preto entram com moderação, como cores de força silenciosa."},{"type":"image","src":"assets/works/topfit/paleta.webp","alt":"Paleta da TOPFIT: vermelho intenso, vermelhos de apoio, bege, branco, cinza claro, vinho e preto","ratio":"7:5","caption":"Paleta de cores"},{"type":"text","label":"Tipografia","text":"A Gasoek One, ultra-bold e de terminal reto, impõe nos títulos, slogans e frases de impacto. Quando o conteúdo precisa respirar, entra a Figtree, versátil e legível, em descrições e textos corridos."},{"type":"image","src":"assets/works/topfit/tipografia.webp","alt":"Especimes das tipografias da TOPFIT: Gasoek One como primária e Figtree como secundária","ratio":"7:5","caption":"Tipografia"},{"type":"text","label":"Aplicações","text":"As variações da marca mudam de contexto sem perder a força: do feed a um vídeo, do carimbo a uma estampa. A box logo estampa a TOPFIT como bandeira, a versão isométrica dá movimento e o ícone assina o que for preciso."},{"type":"pair","items":[{"src":"assets/works/topfit/embalagem.webp","alt":"Embalagem vermelha com o logotipo TOPFIT em branco","caption":"Embalagem","ratio":"7:5"},{"src":"assets/works/topfit/moletom.webp","alt":"Moletom preto com a logo isométrica da TOPFIT em branco","caption":"Moletom","ratio":"7:5"}]},{"type":"pair","items":[{"src":"assets/works/topfit/bone.webp","alt":"Boné preto com o ícone da TOPFIT em branco e aba vermelha por baixo","caption":"Boné","ratio":"7:5"},{"src":"assets/works/topfit/adesivo.webp","alt":"Adesivo redondo vermelho com a logo isométrica e o slogan em volta","caption":"Adesivo","ratio":"7:5"}]},{"type":"statement","text":"Vendemos suplementos. Mas também postura."},{"type":"image","src":"assets/works/topfit/ecommerce-mobile.webp","alt":"Vários celulares mostrando a loja virtual da TOPFIT, com páginas de categorias, produtos e campanhas","ratio":"7:5","caption":"E-commerce no celular"},{"type":"text","label":"E-commerce","text":"No e-commerce próprio, feito em Shopify, a experiência é rápida, segura e sem enrolação, do clique ao resultado. O visual é de alto contraste: fundo preto, tipografia pesada e o vermelho como ponto de ação."},{"type":"image","src":"assets/works/topfit/ecommerce-desktop.webp","alt":"Notebook mostrando a home da loja virtual TOPFIT, com o slogan sobre uma foto de treino","ratio":"7:5","caption":"Home do site"},{"type":"text","label":"Loja física","text":"A loja conceito, em Ribeirão Preto, leva a marca para o espaço: parede vermelha com a logo repetida, o ícone em seta sobre o balcão e as prateleiras escuras. Um ambiente que expressa o posicionamento premium, urbano e de alta performance."},{"type":"image","src":"assets/works/topfit/loja.webp","alt":"Quatro imagens da loja conceito TOPFIT, com parede vermelha estampada, balcão de madeira com o ícone em seta e prateleiras escuras","ratio":"7:5","caption":"Loja conceito"},{"type":"statement","text":"Para chegar ao topo."}],"tagline":"Suplementos para você chegar ao topo.","industry":"Suplementos","credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Fundador","name":"Luiz Arlindo"}],"location":"Ribeirão Preto, SP","website":"https://topfitsuplementos.com.br"},{"slug":"sd-digital","title":"SD Digital","description":"Identidade e presença digital para agência de comércio eletrônico.","year":2025,"services":["Branding","Web Design"],"thumb":"assets/works/sd-digital/hero.webp","hero":{"type":"image","src":"assets/works/sd-digital/hero.webp","mobile":"assets/works/sd-digital/hero-mobile.webp","alt":"SD Digital"},"blocks":[]}]}</script>
