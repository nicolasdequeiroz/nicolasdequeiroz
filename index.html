  <script type="application/json" id="works-data">{"site":{"name":"Nícolas de Queiróz","title":"Nícolas de Queiróz — Branding e Web Design","description":"Designer de branding e web design em Curitiba. Crio marcas, interfaces e sites de alta performance, do conceito ao lançamento.","url":"https://www.nicolasdequeiroz.com","ogImage":"assets/site/og-home.jpg"},"works":[{"slug":"mizzu-sushi","title":"Mizzu Sushi","tagline":"O oceano em sua mesa.","description":"Identidade visual para um restaurante japonês em Siqueira Campos, no interior do Paraná. O nome parte de mizu (水), água em japonês: a ligação entre a água e os frutos do mar, base da gastronomia japonesa, guia a marca. Uma adaptação da Grande Onda de Kanagawa (Hokusai, 1830) evoca a herança japonesa e traz a energia do oceano para cada aplicação.","year":2024,"services":["Identidade visual","Embalagens"],"industry":"Restaurante japonês","location":"Siqueira Campos, PR","thumb":"assets/works/mizzu-sushi/selo-poster.webp","thumbVideo":"assets/works/mizzu-sushi/selo-behance.mp4","hero":{"type":"video","src":"assets/works/mizzu-sushi/selo-behance.mp4","poster":"assets/works/mizzu-sushi/selo-poster.webp","mobile":"assets/works/mizzu-sushi/hero-mobile-selo.webp","mobileVideo":"assets/works/mizzu-sushi/hero-mobile-hq.mp4","alt":"Selo circular do Mizzu Sushi girando sobre padrão de ondas"},"blocks":[{"type":"image","src":"assets/works/mizzu-sushi/assinaturas.webp","alt":"Quatro versões do logotipo do Mizzu Sushi em vermelho, preto, creme e branco","ratio":"16:9","caption":"Assinaturas"},{"type":"text","label":"Conceito","text":"Mizu (水) significa água. A palavra virou o ponto de partida: a água como elo entre o oceano e o prato. O ideograma assume o papel de símbolo, a tipografia serifada com espaçamento largo traz a calma da tradição, e o vermelho com o marrom quase preto remetem à laca e à cerâmica japonesas."},{"type":"pair","items":[{"src":"assets/works/mizzu-sushi/poster.webp","alt":"Pôster vermelho com a Grande Onda em um cavalete","caption":"Pôster"},{"src":"assets/works/mizzu-sushi/mizu-agua.webp","alt":"Ideograma 水 com as palavras Mizu e Água","caption":"水 · Água"}]},{"type":"statement","text":"Uma onda de 1830 como assinatura."},{"type":"image","src":"assets/works/mizzu-sushi/embalagem.webp","alt":"Bandeja de sushi com cinta vermelha do Mizzu, molho shoyu e hashis","ratio":"16:9","caption":"Embalagem"},{"type":"text","label":"Aplicações","text":"O sistema se estende por todo o contato com o cliente: cinta das bandejas de delivery, envelope do hashi, ecobag, cartão, uniforme e o perfil no Instagram. Em cada peça, a onda e o selo aparecem com parcimônia, deixando o vermelho fazer o trabalho."},{"type":"pair","items":[{"src":"assets/works/mizzu-sushi/ecobag.webp","alt":"Ecobag de algodão com a Grande Onda em vermelho","caption":"Ecobag"},{"src":"assets/works/mizzu-sushi/instagram.webp","alt":"Perfil do Mizzu Sushi no Instagram em um celular","caption":"Instagram"}]},{"type":"image","src":"assets/works/mizzu-sushi/hashi.webp","alt":"Hashis em envelope vermelho do Mizzu sobre prato preto","ratio":"4:3","caption":"Hashi"},{"type":"image","src":"assets/works/mizzu-sushi/cartao.webp","alt":"Cartão preto do Mizzu entre flores de cerejeira","ratio":"4:3","caption":"Cartão"},{"type":"image","src":"assets/works/mizzu-sushi/camiseta.webp","alt":"Camiseta branca com o logotipo do Mizzu Sushi","ratio":"16:9","caption":"Uniforme"},{"type":"image","src":"assets/works/mizzu-sushi/embalagem-2.webp","alt":"Bandeja de sushis variados com a cinta do Mizzu","ratio":"16:9"}],"credits":[{"role":"Design e aplicações","name":"Nícolas de Queiróz"},{"role":"Briefing","name":"Matheus Morita"}],"seo":{"title":"Mizzu Sushi — Identidade para restaurante japonês","description":"Identidade visual e embalagens para o Mizzu Sushi, restaurante japonês no Paraná, criada a partir da água (mizu) e de uma adaptação da Grande Onda de Hokusai."},"trail":["assets/works/mizzu-sushi/selo-poster.webp","assets/works/mizzu-sushi/mizu-agua.webp","assets/works/mizzu-sushi/ecobag.webp","assets/works/mizzu-sushi/instagram.webp","assets/works/mizzu-sushi/hashi.webp","assets/works/mizzu-sushi/cartao.webp","assets/works/mizzu-sushi/embalagem.webp","assets/works/mizzu-sushi/embalagem-2.webp"]},{"slug":"jabutibar","title":"JabutiBar","tagline":"Um oásis de descontração no interior paulista.","description":"Identidade visual para um bar ao ar livre em Itaporanga, no interior de São Paulo. O JabutiBar celebra a vida ao ar livre, a comida e a bebida de qualidade e a cultura local. A marca nasce da natureza que cerca o lugar e da atmosfera leve do interior paulista, traduzindo uma filosofia de acolhimento e celebração.","year":2021,"services":["Identidade visual","Ilustração","Cardápio"],"industry":"Bar e lounge","location":"Itaporanga, SP","thumb":"assets/works/jabutibar/hero.webp","hero":{"type":"image","src":"assets/works/jabutibar/hero.webp","mobile":"assets/works/jabutibar/hero-mobile-tote.webp","alt":"Logotipo do JabutiBar com o jabuti, emoldurado por folhagens ilustradas"},"blocks":[{"type":"image","src":"assets/works/jabutibar/kombi.webp","alt":"Kombi verde com o jabuti do JabutiBar estacionada entre árvores","ratio":"16:9"},{"type":"text","label":"Conceito","text":"Um lugar onde as preocupações somem na brisa e as risadas ecoam entre as árvores. O jabuti, sem pressa, virou o símbolo desse ritmo. Verdes de folhagem, um creme de papel e um lettering arredondado dão à marca o tom descontraído do interior, e as ilustrações de folhas trazem a mata para cada peça."},{"type":"image","src":"assets/works/jabutibar/assinaturas.webp","alt":"Versões do logotipo e do selo Bar Lounge do JabutiBar em verde, creme e preto","ratio":"16:9","caption":"Assinaturas"},{"type":"pair","items":[{"src":"assets/works/jabutibar/cartao.webp","alt":"Cartão creme do JabutiBar sobre uma folha grande","caption":"Cartão"},{"src":"assets/works/jabutibar/comanda.webp","alt":"Comanda numerada do JabutiBar entre folhas","caption":"Comanda"}]},{"type":"image","src":"assets/works/jabutibar/cardapio.webp","alt":"Cardápio impresso verde com drinks ilustrados e petiscos","ratio":"16:9","caption":"Cardápio"},{"type":"image","src":"assets/works/jabutibar/cardapio-digital.webp","alt":"Telas do cardápio digital do JabutiBar com destilados","ratio":"16:9","caption":"Cardápio digital"},{"type":"statement","text":"Uma celebração da vida ao ar livre."},{"type":"image","src":"assets/works/jabutibar/posteres.webp","alt":"Dois pôsteres de drinks em uma parede coberta de hera","ratio":"16:9","caption":"Pôsteres"},{"type":"pair","items":[{"src":"assets/works/jabutibar/ecobag.webp","alt":"Ecobag do JabutiBar segurada em meio ao mato alto","caption":"Ecobag"},{"src":"assets/works/jabutibar/garrafa.webp","alt":"Garrafa com rótulo verde do JabutiBar contra o céu","caption":"Garrafa"}]},{"type":"image","src":"assets/works/jabutibar/cavalete.webp","alt":"Cavalete verde com o selo do JabutiBar ao lado de um garçom","ratio":"16:9","caption":"Cavalete"},{"type":"image","src":"assets/works/jabutibar/camiseta.webp","alt":"Camiseta creme com o logotipo do JabutiBar","ratio":"16:9","caption":"Uniforme"}],"credits":[{"role":"Ilustrações","name":"Nícolas de Queiróz e Artur Tadao Massuda"},{"role":"Design e aplicações","name":"Nícolas de Queiróz"},{"role":"Briefing","name":"Leonardo Diniz e Nelson Fiuza"}],"seo":{"title":"JabutiBar — Identidade visual para bar","description":"Identidade visual, ilustração e cardápio para o JabutiBar, bar ao ar livre em Itaporanga (SP) que celebra a natureza, a boa mesa e a cultura local."},"trail":["assets/works/jabutibar/hero.webp","assets/works/jabutibar/kombi.webp","assets/works/jabutibar/cartao.webp","assets/works/jabutibar/comanda.webp","assets/works/jabutibar/ecobag.webp","assets/works/jabutibar/garrafa.webp","assets/works/jabutibar/cavalete.webp","assets/works/jabutibar/posteres.webp"]},{"slug":"studioisa","title":"Studio Isa","description":"Marca para o Studio Isa, estúdio de pilates em Itaporanga (SP) com foco em bem-estar e movimento. Um logotipo em duas vozes, um selo circular e uma paleta de azul-petróleo e bege-pêssego traduzem o cuidado, o detalhe e o acolhimento, do estúdio às redes.","year":2025,"services":["Branding"],"thumb":"assets/works/studioisa/hero-card.webp","hero":{"type":"video","src":"assets/works/studioisa/hero.mp4","poster":"assets/works/studioisa/hero-poster.webp","mobile":"assets/works/studioisa/hero-mobile.webp","alt":"Animação do logotipo isa em bege sobre fundo azul-petróleo"},"blocks":[{"type":"statement","text":"Um novo nome, a mesma essência."},{"type":"text","label":"Sobre a marca","text":"O Studio Isa é um estúdio de pilates em Itaporanga, no interior de São Paulo, com foco em bem-estar e movimento. A marca nasce de uma virada: um novo nome que carrega a mesma essência de sempre, o cuidado, a atenção ao detalhe e o acolhimento, agora com uma identidade própria, leve e reconhecível."},{"type":"image","src":"assets/works/studioisa/moodboard.webp","alt":"Composição com a garrafa, o relógio e a camiseta com a marca, a paleta de cores, uma aula de pilates com a frase Encontre a liberdade de se movimentar com studio isa e o selo circular","ratio":"4:3","caption":"A marca em uso"},{"type":"text","label":"Logotipo","text":"O nome em duas vozes: “studio” em itálico leve e “isa” em peso, no mesmo desenho serifado. O contraste entre o traço fino e o grosso é o movimento da marca: a calma do alongamento e a firmeza do exercício. A versão com “pilates” em sans acompanha o nome quando é preciso dizer o que o estúdio faz."},{"type":"pair","items":[{"src":"assets/works/studioisa/monograma.webp","alt":"Monograma isa em azul sobre fundo bege","caption":"Monograma","ratio":"1:1"},{"src":"assets/works/studioisa/selo.webp","alt":"Selo circular com o monograma isa e a frase Pilates Studio repetida em volta","caption":"Selo","ratio":"1:1"}]},{"type":"text","label":"Cores","text":"O azul-petróleo é a base: sereno e profundo, passa confiança. O bege-pêssego traz o calor do acolhimento, e o branco abre espaço para respirar. Entre eles, tons de azul mais claro e escuro dão profundidade ao sistema sem tirar a leveza."},{"type":"palette","items":[{"name":"Azul noite","hex":"#1B2935"},{"name":"Azul-petróleo","hex":"#2D4356"},{"name":"Azul médio","hex":"#4B7192"},{"name":"Bege-pêssego","hex":"#F7DCC1"},{"name":"Branco","hex":"#FFFFFF"}]},{"type":"statement","text":"Pilates feito com alma, detalhe & acolhimento."},{"type":"text","label":"Aplicações","text":"A marca sai do papel e ocupa o estúdio: da fachada e da vitrine às placas, camisetas, sacolas e peças do dia a dia. O selo circular vira assinatura, e a frase da marca gira em volta do monograma."},{"type":"image","src":"assets/works/studioisa/fachada.webp","alt":"Fachada do estúdio em azul-petróleo com o logotipo studio isa em relevo, sobre uma vitrine com portas de vidro iluminadas","ratio":"16:9","caption":"Fachada"},{"type":"image","src":"assets/works/studioisa/vitrine.webp","alt":"Vitrine do estúdio com adesivos jateados: o selo circular com a frase da marca, o logotipo nas laterais e, nas variações, o contato e o Instagram","ratio":"16:9","caption":"Vitrine"},{"type":"pair","items":[{"src":"assets/works/studioisa/placa-azul.webp","alt":"Placa circular de parede, azul, com o monograma isa e a frase Pilates Studio","caption":"Placa azul","ratio":"1:1"},{"src":"assets/works/studioisa/placa-bege.webp","alt":"Placa circular de parede, bege, com o monograma isa e a frase Pilates Studio","caption":"Placa bege","ratio":"1:1"}]},{"type":"pair","items":[{"src":"assets/works/studioisa/camiseta-1.webp","alt":"Camiseta cinza-chumbo com o selo circular e o logotipo studio isa no peito","caption":"Camiseta","ratio":"1:1"},{"src":"assets/works/studioisa/camiseta-2.webp","alt":"Camiseta cinza-chumbo com o logotipo studio isa e o rótulo pilates","caption":"Camiseta com rótulo","ratio":"1:1"}]},{"type":"text","label":"Wellness Era","text":"Uma linha de camisetas leva a marca para o corpo: a frase “Welcome to My Wellness Era” nas costas, o selo “Pilates & Gym” e o logotipo discreto na frente, em bege e marrom. É uma peça para treinar e para circular, que conta a mesma história do estúdio."},{"type":"pair","items":[{"src":"assets/works/studioisa/wellness-bola.webp","alt":"Mulher de costas segurando uma bola de peso sobre a cabeça, com a camiseta marrom Welcome to My Wellness Era","caption":"Camiseta marrom","ratio":"4:5"},{"src":"assets/works/studioisa/wellness-banda.webp","alt":"Mulher de costas com uma faixa elástica laranja, com a camiseta bege Welcome to My Wellness Era","caption":"Camiseta bege","ratio":"4:5"}]},{"type":"pair","items":[{"src":"assets/works/studioisa/wellness-bege.webp","alt":"Mulher de pé com a mão na cintura e uma faixa laranja, com camiseta marrom e o logotipo studio isa na frente","caption":"Frente, marrom","ratio":"auto"},{"src":"assets/works/studioisa/wellness-marrom.webp","alt":"Mulher de perfil com uma faixa laranja no pescoço, com camiseta bege com a frase My Wellness Era","caption":"Frente, bege","ratio":"auto"}]},{"type":"pair","items":[{"src":"assets/works/studioisa/wellness-frase.webp","alt":"Arte com o logotipo studio isa, a frase Welcome to My Wellness Era e o selo Pilates & Gym","caption":"A frase","ratio":"1:1"},{"src":"assets/works/studioisa/wellness-camiseta-bege.webp","alt":"Costas de uma camiseta bege com a frase Welcome to My Wellness Era e o selo Pilates & Gym","caption":"Costas, bege","ratio":"1:1"},{"src":"assets/works/studioisa/wellness-camiseta-marrom.webp","alt":"Costas de uma camiseta marrom com a frase Welcome to My Wellness Era em bege","caption":"Costas, marrom","ratio":"1:1"}]},{"type":"pair","items":[{"src":"assets/works/studioisa/story-novo-nome-2.webp","alt":"Story com três mulheres sorrindo sobre azul e o texto studio isa, um novo nome, a mesma essência","caption":"Um novo nome","ratio":"auto"},{"src":"assets/works/studioisa/sacola-2.webp","alt":"Mulher de perfil segurando uma sacola de algodão cru com o selo circular Pilates feito com alma, detalhe & acolhimento e o logotipo studio isa em azul","caption":"Sacola","ratio":"auto"}]},{"type":"image","src":"assets/works/studioisa/studio-reformer.webp","alt":"Duas mulheres praticando pilates em aparelhos reformer, em tons de azul, com o logotipo studio isa em bege no centro","ratio":"16:9"},{"type":"statement","text":"Encontre a liberdade de se movimentar."},{"type":"text","label":"Comunicação","text":"No digital, a identidade ganha voz: posts de equipe, datas especiais, convites e avisos do estúdio. O azul e o bege seguram a linguagem, e o tom é sempre próximo, como uma conversa na sala de aula."},{"type":"pair","items":[{"src":"assets/works/studioisa/equipe-isa.webp","alt":"Retrato da Isa em um post da equipe, com a frase Prazer, Isa","ratio":"4:5"},{"src":"assets/works/studioisa/equipe-conheca.webp","alt":"Post com o título Conheça a nossa equipe sobre fundo bege","ratio":"4:5"},{"src":"assets/works/studioisa/equipe-bianca.webp","alt":"Retrato da Bianca em um post da equipe, com a frase Prazer, Bianca","ratio":"4:5"},{"src":"assets/works/studioisa/equipe-rayane.webp","alt":"Retrato da Rayane em um post da equipe, com a frase Prazer, Rayane","ratio":"4:5"},{"src":"assets/works/studioisa/equipe-bruna.webp","alt":"Retrato da Bruna em um post da equipe, com a frase Prazer, Bruna","ratio":"4:5"},{"src":"assets/works/studioisa/equipe-thaina.webp","alt":"Retrato da Thainá em um post da equipe, com a frase Prazer, Thainá","ratio":"4:5"}],"feed":false},{"type":"pair","items":[{"src":"assets/works/studioisa/perfil-1.webp","alt":"Logotipo studio isa em bege sobre um degradê de azul","caption":"Assinatura sobre azul","ratio":"1:1"},{"src":"assets/works/studioisa/perfil-2.webp","alt":"Logotipo studio isa em duas linhas, em bege sobre um degradê de azul","caption":"Assinatura vertical","ratio":"1:1"}],"feed":false},{"type":"statement","text":"Cuidado que se movimenta com você."}],"credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Motion graphics","name":"Lucas de Santi"},{"role":"Briefing","name":"Isabelly Azevedo"}],"location":"Itaporanga, SP","seo":{"title":"Studio Isa — Marca para estúdio de pilates","description":"Marca para o Studio Isa, estúdio de pilates em Itaporanga (SP): logotipo em duas vozes, selo circular e paleta azul-petróleo e pêssego, do estúdio às redes."},"trail":["assets/works/studioisa/moodboard.webp","assets/works/studioisa/monograma.webp","assets/works/studioisa/selo.webp","assets/works/studioisa/fachada.webp","assets/works/studioisa/vitrine.webp","assets/works/studioisa/wellness-banda.webp","assets/works/studioisa/wellness-bola.webp","assets/works/studioisa/wellness-bege.webp"]},{"slug":"topfit","title":"TOPFIT","description":"Identidade visual completa para a TOPFIT, marca conceito de suplementos de Ribeirão Preto (SP) que quer representar atitude, além de vender produtos. Letras brutas e blocadas, um vermelho intenso e um ícone em forma de seta, que sobe, sustentam a marca do e-commerce às embalagens.","year":2025,"services":["Identidade visual","Embalagens","E-commerce"],"thumb":"assets/works/topfit/hero.webp","hero":{"type":"image","src":"assets/works/topfit/hero.webp","mobile":"assets/works/topfit/hero-mobile-selo.webp","alt":"Camiseta preta com a etiqueta vermelha do logotipo TOPFIT"},"blocks":[{"type":"text","label":"Sobre a marca","text":"A TOPFIT não nasceu para ser só mais uma loja de suplementos. Atua com loja física, e-commerce próprio, marketplaces e distribuição, e vende mais do que produto: vende atitude, curadoria e posicionamento. Uma marca com voz própria, provocadora, bruta, direta e autêntica."},{"type":"text","label":"Missão e visão","text":"Entregar os melhores suplementos do mercado com curadoria, personalidade e impacto, e ajudar os clientes a chegarem no topo, seja físico, mental, estético ou de vida, sem enrolação. A visão é ser a marca mais lembrada entre as lojas de suplemento no Brasil: não pela variedade, mas pela postura. Pela entrega. Pela identidade."},{"type":"image","src":"assets/works/topfit/missao-visao-foto.webp","alt":"Retrato em preto e branco de uma atleta com uma toalha no vestiário, ao lado de uma textura de pedra escura","ratio":"auto","caption":"Missão e visão"},{"type":"text","label":"Personalidade","text":"Provocadora, bruta, direta e autêntica. A TOPFIT cutuca, contesta e não suaviza o que pensa: a provocação é o chamado à ação. É densa e sólida, no visual e no verbal, e o impacto está na base. Foco no necessário: diz o que importa, e ponto. Tem cara, tom e presença, um statement visual e verbal."},{"type":"text","label":"Escopo","text":"O trabalho passou pela construção estratégica da marca: logotipo, tipografia, paleta de cores, conceito, ícone, variações e tom de voz, sempre direto, de alto contraste e com o arquétipo do rebelde. Dali, a identidade seguiu para o e-commerce, as embalagens e o conteúdo digital, estampas e meios físicos."},{"type":"image","src":"assets/works/topfit/logos-principais.svg","alt":"Logotipos principais da TOPFIT em vermelho: logo primária, ícone de seta e logo com slogan","ratio":"auto","caption":"Logotipos principais"},{"type":"image","src":"assets/works/topfit/logos-variacoes.svg","alt":"Variações da logo TOPFIT: box logo, vertical, isométrica e estilizada","ratio":"auto","caption":"Variações"},{"type":"text","label":"Logotipo","text":"A logo é uma afirmação visual: o nome em sua forma mais pura, em letras brutas, blocadas e pesadas. Removemos até a contraforma do “O” e do “P” para intensificar a sensação de bloco, e a tipografia quase não tem espaçamento. Com essas definições, a única cor que cabia era o vermelho, por sua natureza visceral e corajosa."},{"type":"image","src":"assets/works/topfit/logotipo.webp","alt":"Logotipo TOPFIT em branco sobre degradê de vermelho a vinho, com o slogan Suplementos para você chegar ao topo","ratio":"16:9","caption":"Logotipo e slogan"},{"type":"text","label":"Área de exclusão","text":"A marca foi feita pra ser vista, com impacto, clareza e respeito ao seu espaço. A área de exclusão define o respiro mínimo ao redor da logo, garantindo legibilidade e presença mesmo em ambientes visuais carregados. A medida base é a largura da letra “I” (X), e o espaço livre ao redor da marca deve ser de, no mínimo, 2X."},{"type":"pair","items":[{"src":"assets/works/topfit/construcao-logotipo.webp","alt":"Logotipo TOPFIT sobre uma grade, com a tipografia quase sem espaçamento para reforçar a ideia de bloco","caption":"Construção do logotipo","ratio":"auto"},{"src":"assets/works/topfit/area-exclusao.webp","alt":"Logotipo TOPFIT cercado pela área de exclusão, com a medida X e o espaço mínimo de 2X","caption":"Área de exclusão","ratio":"auto"}]},{"type":"statement","text":"Símbolos que gritam, não sussurram."},{"type":"image","src":"assets/works/topfit/icone.svg","alt":"Ícone da TOPFIT: uma seta isométrica branca sobre fundo vermelho, com linhas de construção","ratio":"auto","caption":"Ícone"},{"type":"text","label":"Ícone","text":"Construído a partir do “T” da marca, distorcido simetricamente, separado em dois blocos e inclinado em 30 graus, cria uma vista isométrica que lembra uma quina sólida. Pode ser lido como uma seta disfarçada apontando para cima, a quina de uma caixa de e-commerce ou um selo geométrico que marca território."},{"type":"image","src":"assets/works/topfit/perfil-icone.webp","alt":"Perfil da TOPFIT em uma rede social, com o ícone em seta como foto, e o ícone como app em um fundo vermelho","ratio":"16:9","caption":"O ícone no perfil"},{"type":"text","label":"Cores","text":"O vermelho intenso (#C21819) é o tom principal: força, movimento e potência. Branco e cinza claro dão respiro e legibilidade, principalmente no digital, enquanto o vinho e o preto entram com moderação, como cores de força silenciosa."},{"type":"palette","items":[{"name":"Vermelho intenso","hex":"#C21819"},{"name":"Vermelho escuro","hex":"#A6111F"},{"name":"Vermelho médio","hex":"#DA564A"},{"name":"Bege claro","hex":"#F8B7A1"},{"name":"Branco puro","hex":"#FFFFFF"},{"name":"Cinza claro","hex":"#F1F1F1"},{"name":"Vinho","hex":"#2E0506"},{"name":"Preto puro","hex":"#000000"}]},{"type":"text","label":"Tipografia","text":"A Gasoek One, ultra-bold e de terminal reto, impõe nos títulos, slogans e frases de impacto. Quando o conteúdo precisa respirar, entra a Figtree, versátil e legível, em descrições e textos corridos."},{"type":"pair","items":[{"src":"assets/works/topfit/tipografia-gasoek-vermelho.svg","alt":"Especimes da tipografia Gasoek One em vermelho: o nome da fonte e o alfabeto, números e símbolos","ratio":"auto"},{"src":"assets/works/topfit/tipografia-textura.webp","alt":"Textura de rocha rachada em preto e branco","caption":"Textura da marca","ratio":"auto"}]},{"type":"text","label":"Aplicações","text":"As variações da marca mudam de contexto sem perder a força: do feed a um vídeo, do carimbo a uma estampa. A box logo estampa a TOPFIT como bandeira, a versão isométrica dá movimento e o ícone assina o que for preciso."},{"type":"pair","items":[{"src":"assets/works/topfit/embalagem.webp","alt":"Embalagem vermelha com o logotipo TOPFIT em branco","caption":"Embalagem","ratio":"1:1"},{"src":"assets/works/topfit/moletom.webp","alt":"Moletom preto com a logo isométrica da TOPFIT em branco","caption":"Moletom","ratio":"1:1"}]},{"type":"pair","items":[{"src":"assets/works/topfit/bone.webp","alt":"Boné preto com o ícone da TOPFIT em branco e aba vermelha por baixo","caption":"Boné","ratio":"1:1"},{"src":"assets/works/topfit/adesivo.webp","alt":"Adesivo redondo vermelho com a logo isométrica e o slogan em volta","caption":"Adesivo","ratio":"1:1"}]},{"type":"pair","items":[{"src":"assets/works/topfit/camiseta.webp","alt":"Camiseta preta com a box logo vermelha da TOPFIT no peito","caption":"Camiseta","ratio":"auto"},{"src":"assets/works/topfit/sacola-vermelha.webp","alt":"Embalagem plástica vermelha com o logotipo TOPFIT em branco","caption":"Embalagem plástica","ratio":"auto"}]},{"type":"image","src":"assets/works/topfit/anuncio-forca.webp","alt":"Anúncio com um atleta curvado, de toalha no pescoço, e a frase Força não se improvisa. Se constrói.","ratio":"16:9","caption":"Anúncio"},{"type":"text","label":"Padrões e selos","text":"A marca também vira padrão: a seta que sobe, o nome repetido como estampa, o selo circular com o slogan e o contorno do ícone sobre uma montanha, que lembra que o topo é o destino."},{"type":"image","src":"assets/works/topfit/padrao-setas.webp","alt":"Padrão de setas brancas sobre vermelho, ao lado de uma foto de um atleta e da box logo vermelha sobre fundo vinho","ratio":"auto","caption":"Padrão de setas"},{"type":"pair","items":[{"src":"assets/works/topfit/padrao-wordmark.webp","alt":"Estampa com o nome TOPFIT repetido em vermelho sobre vinho","caption":"Estampa do nome","ratio":"auto"},{"src":"assets/works/topfit/selo-circular.webp","alt":"Selo circular com o ícone em seta e o texto Suplementos para você chegar ao topo, em branco sobre vermelho","caption":"Selo circular","ratio":"auto"}]},{"type":"pair","items":[{"src":"assets/works/topfit/montanha-icone.webp","alt":"Contorno do ícone em seta, em branco, sobre uma montanha em preto e branco, com a frase Você não veio até aqui pra ser mais um","caption":"Ícone e montanha","ratio":"auto"},{"src":"assets/works/topfit/logo-montanha.webp","alt":"Logotipo TOPFIT em vermelho e em branco ao lado de uma montanha rosada, com o nome na vertical","caption":"Logotipo e montanha","ratio":"auto"}]},{"type":"statement","text":"Vendemos suplementos. Mas também postura."},{"type":"image","src":"assets/works/topfit/ecommerce-mobile.webp","alt":"Vários celulares mostrando a loja virtual da TOPFIT, com páginas de categorias, produtos e campanhas","ratio":"4:3","caption":"E-commerce no celular"},{"type":"text","label":"E-commerce","text":"No e-commerce próprio, feito em Shopify, a experiência é rápida, segura e sem enrolação, do clique ao resultado. O visual é de alto contraste: fundo preto, tipografia pesada e o vermelho como ponto de ação."},{"type":"image","src":"assets/works/topfit/ecommerce-desktop.webp","alt":"Notebook mostrando a home da loja virtual TOPFIT, com o slogan sobre uma foto de treino","ratio":"4:3","caption":"Home do site"},{"type":"text","label":"Embalagens","text":"Todas as embalagens dos produtos próprios foram desenhadas por mim. A marca vira rótulo: tipografia bruta, ícones geométricos e o vermelho como protagonista, em contraste com o minimalismo do branco, para a TOPFIT se destacar em qualquer prateleira."},{"type":"gallery","items":[{"src":"assets/works/topfit/emb-whey.webp","alt":"Pote de Whey Protein branco com rótulo vermelho e a montanha ao fundo","caption":"Whey Protein","ratio":"4:5"},{"src":"assets/works/topfit/emb-creatina.webp","alt":"Pote de Creatina monohidratada com rótulo branco e vermelho e o selo com a seta","caption":"Creatina","ratio":"4:5"},{"src":"assets/works/topfit/emb-pre-treino.webp","alt":"Pote preto de pré-treino Shock Boost com rótulo verde e uma onça","caption":"Pré-treino","ratio":"4:5"},{"src":"assets/works/topfit/emb-termogenico.webp","alt":"Frasco de cápsulas Thermo Fit&Lean com rótulo branco e vermelho","caption":"Termogênico","ratio":"4:5"},{"src":"assets/works/topfit/emb-nac.webp","alt":"Frasco de cápsulas de NAC com rótulo branco e vermelho","caption":"NAC","ratio":"4:5"}],"feed":false},{"type":"image","src":"assets/works/topfit/bloco-pedra.webp","alt":"O logotipo TOPFIT em relevo em um bloco de pedra vermelha, sobre um terreno rachado e um céu escuro","ratio":"16:9","caption":"O logotipo em pedra"},{"type":"statement","text":"Para chegar ao topo."}],"tagline":"Suplementos para você chegar ao topo.","industry":"Suplementos","credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Agência","name":"SD Digital"},{"role":"Briefing","name":"Luiz Arlindo"}],"location":"Ribeirão Preto, SP","seo":{"title":"TOPFIT — Identidade para suplementos","description":"Identidade visual da TOPFIT, marca de suplementos de Ribeirão Preto (SP): letras blocadas, vermelho intenso e uma seta que sobe, do e-commerce às embalagens."},"trail":["assets/works/topfit/tipografia-textura.webp","assets/works/topfit/anuncio-forca.webp","assets/works/topfit/padrao-setas.webp","assets/works/topfit/padrao-wordmark.webp","assets/works/topfit/selo-circular.webp","assets/works/topfit/montanha-icone.webp","assets/works/topfit/logo-montanha.webp","assets/works/topfit/bloco-pedra.webp"]},{"slug":"move","title":"Move+","description":"Identidade visual para a Move+, centro de treinamento de condicionamento e força. Um logotipo inclinado, em verde-oliva escuro com um + em verde-limão, passa velocidade e evolução, e se aplica do ícone no relógio à camiseta, com uma voz direta que promete mais técnica, mais controle e mais movimento.","year":2025,"services":["Identidade visual","Aplicações"],"thumb":"assets/works/move/hero-card.webp","hero":{"type":"video","src":"assets/works/move/hero.mp4","poster":"assets/works/move/hero-poster.webp","mobile":"assets/works/move/hero-mobile.webp","alt":"Move+: condicionamento e força"},"blocks":[{"type":"text","label":"Sobre a marca","text":"A Move+ é um centro de treinamento de condicionamento e força. Oferece orientação profissional, foco nos objetivos e um caminho construído com consistência. A marca traduz isso em letras inclinadas, que seguem para a frente, e um sinal de + em verde-limão: sempre um passo a mais."},{"type":"image","src":"assets/works/move/capa-treino.webp","alt":"Mulher em posição de flexão no chão de um estúdio, com o logotipo Move+ e a frase Condicionamento e Força","ratio":"4:3","caption":"Capa"},{"type":"text","label":"Logotipo","text":"O logotipo é todo inclinado, com cortes diagonais nas letras, para dar velocidade. O verde-oliva escuro traz firmeza e o + em verde-limão é o único ponto de cor, o sinal de evolução. A versão com “Centro de treinamento” acompanha a marca nos materiais."},{"type":"pair","items":[{"src":"assets/works/move/logo-claro.svg","alt":"Logotipo Move+ em verde-oliva com o + em verde-limão e a legenda Centro de treinamento, sobre fundo branco","caption":"Versão clara","ratio":"auto"},{"src":"assets/works/move/logo-escuro.svg","alt":"Logotipo Move+ em branco com o + em verde-limão e a legenda Centro de treinamento, sobre fundo escuro","caption":"Versão escura","ratio":"auto"}]},{"type":"image","src":"assets/works/move/icones.svg","alt":"Ícone M+ em branco sobre verde-oliva e em verde-oliva escuro sobre verde-limão","ratio":"auto","caption":"Ícone"},{"type":"text","label":"Ícone","text":"O ícone reduz a marca ao M e ao +: uma forma inclinada, em movimento, que cabe num aplicativo, num relógio ou numa foto de perfil."},{"type":"statement","text":"Mais técnica. Mais controle. Mais movimento."},{"type":"image","src":"assets/works/move/tipografia-contorno.webp","alt":"Logotipo Move+ nas versões clara e escura ao lado de uma atleta com kettlebell, com o nome em contorno repetido sobre a foto","ratio":"4:3","caption":"Marca sobre fotografia"},{"type":"text","label":"Cores","text":"O verde-oliva escuro dá a base, sóbria e firme, e o verde-limão entra como energia, em pequenas doses."},{"type":"palette","items":[{"name":"Verde mais escuro","hex":"#212514"},{"name":"Verde-oliva","hex":"#404725"},{"name":"Verde médio","hex":"#556B2B"},{"name":"Verde-limão","hex":"#C5DE63"},{"name":"Branco","hex":"#FFFFFF"}]},{"type":"slide","src":"assets/works/move/foto-transformacao.webp","alt":"Atleta apoiada em uma bola de peso em um treino, em uma academia","logo":"assets/works/move/logo-branco.svg","logoAlt":"Move+","title":["Mais do que treino.","É transformação."],"text":"Aqui você encontra orientação profissional, foco nos seus objetivos e um caminho construído com consistência. Aqui, cada avanço é conquista — física, mental e pessoal."},{"type":"slide","src":"assets/works/move/foto-precisao.webp","alt":"Atleta fazendo um treino com cordas navais, concentrada, em um fundo neutro","logo":"assets/works/move/logo-branco.svg","logoAlt":"Move+","title":["Treino com propósito.","Resultado com precisão."],"text":"Na Move+, cada movimento é planejado para levar você mais longe. Com acompanhamento técnico e atenção às suas necessidades, transformamos esforço em evolução — com eficiência, segurança e resultado real."},{"type":"text","label":"Aplicações","text":"A marca ganha corpo nas peças do dia a dia do treino: o que se veste, se carrega e se usa no pulso. O logotipo e o ícone mudam de tamanho e de fundo sem perder a presença."},{"type":"gallery","items":[{"src":"assets/works/move/sacola.webp","alt":"Sacola esportiva preta com o logotipo Move+ e cordões em verde-limão","caption":"Sacola","ratio":"4:5"},{"src":"assets/works/move/moletom.webp","alt":"Moletom verde-oliva com zíper e o logotipo Move+ no peito","caption":"Moletom","ratio":"4:5"},{"src":"assets/works/move/camiseta.webp","alt":"Camiseta verde-oliva com o logotipo Move+ no peito","caption":"Camiseta","ratio":"4:5"},{"src":"assets/works/move/garrafa.webp","alt":"Garrafa térmica verde-escura com o logotipo Move+ na vertical","caption":"Garrafa","ratio":"4:5"},{"src":"assets/works/move/relogio.webp","alt":"Relógio com pulseira verde-oliva trançada e o ícone M+ na tela em verde-limão","caption":"Relógio","ratio":"4:5"}]},{"type":"image","src":"assets/works/move/kettlebell.webp","alt":"Pessoa levantando um kettlebell, com o logotipo Move+ em branco ao lado","ratio":"4:3","caption":"Assinatura em foto"},{"type":"video","src":"assets/works/move/showreel.mp4","poster":"assets/works/move/showreel-poster.webp","ratio":"9:16","alt":"Showreel da Move+: logotipo animado, foto com kettlebell e tipografia em contorno e as aplicações da marca"},{"type":"statement","text":"Mais movimento."}],"tagline":"Mais técnica. Mais controle. Mais movimento.","industry":"Centro de treinamento","credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Motion graphics","name":"Lucas de Santi"},{"role":"Briefing","name":"Maria Carolina S. Prestes"}],"seo":{"title":"Move+ — Identidade para centro de treinamento","description":"Identidade visual da Move+, centro de treinamento de condicionamento e força: logotipo inclinado em verde-oliva com um + verde-limão, do relógio à camiseta."},"trail":["assets/works/move/hero-card.webp","assets/works/move/capa-treino.webp","assets/works/move/moletom.webp","assets/works/move/camiseta.webp","assets/works/move/garrafa.webp","assets/works/move/relogio.webp","assets/works/move/kettlebell.webp"]},{"slug":"frias-constantino","title":"Frias Constantino","tagline":"Advocacia tributária preventiva e estratégica.","description":"Identidade visual para a Frias Constantino Advocacia, escritório de advocacia tributária no Tatuapé, em São Paulo. Uma coruja em traço de gravura, um monograma FC de iniciais sobrepostas e uma paleta de verde, areia e ouro comunicam precisão antes mesmo da primeira conversa.","year":2026,"services":["Identidade visual","Papelaria"],"industry":"Advocacia tributária","location":"São Paulo","thumb":"assets/works/frias-constantino/hero.webp","hero":{"type":"image","src":"assets/works/frias-constantino/hero.webp","mobile":"assets/works/frias-constantino/hero-mobile-logo.webp","alt":"Lombada de um livro verde com o logotipo Frias Constantino Advocacia em dourado"},"blocks":[{"type":"statement","text":"Uma marca construída com o mesmo critério que ela representa."},{"type":"text","label":"Conceito","text":"Cada escolha, do traço à tipografia, responde a uma intenção: comunicar precisão antes mesmo da primeira conversa."},{"type":"image","src":"assets/works/frias-constantino/logotipo.svg","alt":"Logotipo Frias Constantino Advocacia em verde sobre fundo areia","ratio":"auto","caption":"Logotipo"},{"type":"image","src":"assets/works/frias-constantino/logotipo-dourado.webp","alt":"Logotipo Frias Constantino Advocacia em dourado em relevo sobre papel verde-escuro texturizado","ratio":"16:9","caption":"Dourado sobre verde"},{"type":"text","label":"A coruja","text":"A coruja atravessa culturas como símbolo de sabedoria. É a companheira de Atena, deusa grega da estratégia. Mas o que a torna precisa para esta marca é o seu comportamento: ela enxerga onde os outros não veem, voa em silêncio absoluto e age com exatidão cirúrgica. Observação, discrição e precisão: a mesma tríade que define uma boa advocacia tributária. Representada em traço de gravura, remete à tradição jurídica e editorial; em movimento de voo, comunica uma prática que não espera o problema: antecipa."},{"type":"image","src":"assets/works/frias-constantino/coruja-por-que.webp","alt":"Coruja pousada sobre o logotipo, com anotações à mão em vermelho: por que uma coruja? Clareza, foco, visão aguçada, percepção, vigilância e sabedoria","ratio":"16:9","caption":"Por que uma coruja?"},{"type":"image","src":"assets/works/frias-constantino/coruja-familia.svg","alt":"Seis versões da coruja da marca: em voo de frente, em voo de lado, pousada e com o nome Frias Constantino","ratio":"16:9","caption":"Família de corujas"},{"type":"text","label":"Assinaturas","text":"O nome em duas linhas é a assinatura principal e se adapta a cada fundo: dourado sobre verde ou preto, verde sobre areia. Quando há espaço, a coruja em voo ou o selo FC em losango se juntam ao nome e formam as assinaturas completas."},{"type":"image","src":"assets/works/frias-constantino/assinaturas-cores.webp","alt":"Três versões do logotipo: dourado sobre verde, verde sobre areia e dourado sobre preto","ratio":"16:9","caption":"Versões de cor"},{"type":"pair","items":[{"src":"assets/works/frias-constantino/assinatura-coruja.webp","alt":"Assinatura vertical com a coruja em voo sobre o nome Frias Constantino Advocacia","caption":"Com a coruja","ratio":"16:9"},{"src":"assets/works/frias-constantino/assinatura-selo.webp","alt":"Assinatura vertical com o selo FC em losango sobre o nome Frias Constantino Advocacia","caption":"Com o selo FC","ratio":"16:9"}]},{"type":"text","label":"Monograma","text":"O monograma FC nasce da sobreposição das iniciais, não lado a lado, mas atravessadas. O F se apoia na estrutura do C, e o C abraça a haste do F. É uma construção que só funciona porque as duas formas foram desenhadas uma para a outra, do mesmo modo que uma boa tese só se sustenta quando cada argumento amarra no seguinte. O desenho parte da tradição dos monogramas de selo: a chancela que, muito antes das assinaturas digitais, validava documentos e dava fé ao que estava escrito. Sozinho, o monograma é a forma mais condensada da marca: onde o nome completo não cabe, ele responde."},{"type":"pair","items":[{"src":"assets/works/frias-constantino/monograma.webp","alt":"Monograma FC em relevo sobre fundo verde","caption":"Monograma em relevo","ratio":"4:3"},{"src":"assets/works/frias-constantino/marca-final.svg","alt":"Coruja pousada sobre o monograma FC, em verde sobre fundo areia","caption":"Coruja sobre o monograma","ratio":"4:3"}]},{"type":"image","src":"assets/works/frias-constantino/monograma-versoes.webp","alt":"Monograma FC em areia sobre verde e em verde sobre areia","ratio":"16:9","caption":"Monograma"},{"type":"pair","items":[{"src":"assets/works/frias-constantino/icone-versoes.webp","alt":"Ícone compacto do monograma em areia sobre verde e em verde sobre areia","caption":"Ícone","ratio":"16:9"},{"src":"assets/works/frias-constantino/selo-versoes.webp","alt":"Selo FC em losango, em areia sobre verde e em verde sobre areia","caption":"Selo FC","ratio":"16:9"}]},{"type":"text","label":"Cores","text":"A paleta parte do verde, cor da estabilidade, do equilíbrio e da prosperidade, em uma família que vai do profundo ao sereno, sustentando a marca com a mesma constância que se espera de uma boa assessoria. Sobre ela, o areia e os marrons trazem o calor do papel e do couro, um repertório herdado do universo dos documentos e das bibliotecas jurídicas. O ouro, sempre em dose precisa, é o ponto de valor: aparece onde a marca quer conduzir o olhar, como um fio de destaque em meio à sobriedade."},{"type":"palette","items":[{"name":"Verde","hex":"#324036"},{"name":"Verde claro","hex":"#92A673"},{"name":"Verde escuro","hex":"#111512"},{"name":"Areia","hex":"#F3EDDF"},{"name":"Marrom claro","hex":"#AF9061"},{"name":"Marrom escuro","hex":"#2E2216"},{"name":"Ouro claro","hex":"#F1DEB5"},{"name":"Ouro","hex":"#D0AC64"},{"name":"Ouro escuro","hex":"#97733D"}]},{"type":"statement","text":"Nenhuma cor grita; todas afirmam."},{"type":"text","label":"Aplicações","text":"A identidade ganha corpo no papel, no tecido e na tela: o dourado em relevo sobre o verde profundo, a coruja em marca d’água e o monograma como assinatura, onde o nome completo não cabe."},{"type":"image","src":"assets/works/frias-constantino/brochura.webp","alt":"Mãos segurando uma brochura verde com o logotipo dourado e a coruja em marca d’água","ratio":"16:9","caption":"Brochura"},{"type":"image","src":"assets/works/frias-constantino/cartoes.webp","alt":"Dois cartões de visita verdes, um com o logotipo dourado e outro com os dados de contato e a coruja em marca d’água","ratio":"16:9","caption":"Cartões de visita"},{"type":"image","src":"assets/works/frias-constantino/pecas-impressas.webp","alt":"Três peças impressas: uma página areia com o logotipo e uma foto de escritório, um retrato da advogada sobre fundo verde e uma página escura com a coruja e uma frase","ratio":"16:9","caption":"Peças impressas"},{"type":"image","src":"assets/works/frias-constantino/cartazes.webp","alt":"Dois cartazes: um com a gravura de um busto clássico e a frase Tranquilidade fiscal se constrói com método, outro com o retrato de uma advogada e a frase Segurança jurídica é o solo onde negócios crescem","ratio":"16:9","caption":"Cartazes"},{"type":"image","src":"assets/works/frias-constantino/uniformes.webp","alt":"Uniformes: uma polo verde-clara com o monograma FC bordado, o monograma em relevo seco sobre papel areia e uma camisa verde-escura com o logotipo","ratio":"16:9","caption":"Uniformes"},{"type":"image","src":"assets/works/frias-constantino/perfil.webp","alt":"Perfil da Frias Constantino Advocacia em uma rede social, com capa verde, o monograma como foto e a bio Advocacia tributária preventiva e estratégica","ratio":"16:9","caption":"Perfil nas redes"},{"type":"image","src":"assets/works/frias-constantino/perfil-escuro.webp","alt":"Perfil da Frias Constantino Advocacia em versão escura, com capa de listras em verde e o selo FC como foto","ratio":"16:9","caption":"Perfil nas redes, versão escura"},{"type":"statement","text":"Precisão antes da primeira conversa."}],"credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Briefing","name":"Carolina Frias Constantino"}],"seo":{"title":"Frias Constantino — Identidade para advocacia","description":"Identidade visual da Frias Constantino, advocacia tributária em São Paulo: coruja em traço de gravura, monograma FC e paleta de verde, areia e ouro."},"trail":["assets/works/frias-constantino/hero.webp","assets/works/frias-constantino/logotipo-dourado.webp","assets/works/frias-constantino/monograma.webp","assets/works/frias-constantino/brochura.webp","assets/works/frias-constantino/cartoes.webp","assets/works/frias-constantino/pecas-impressas.webp","assets/works/frias-constantino/uniformes.webp","assets/works/frias-constantino/monograma-versoes.webp"]},{"slug":"tasty-nutrition","title":"Tasty Nutrition","tagline":"Sabor primeiro. Sempre.","description":"Identidade visual para a Tasty Nutrition, marca premium de suplementos ancorada em saúde, bem-estar e lifestyle. No lugar da estética agressiva do segmento, um lettering script dentro de um contêiner macio, uma paleta que nasce da despensa e uma linguagem que convida em vez de cobrar.","year":2026,"services":["Identidade visual","Brandbook","Embalagens"],"industry":"Suplementos","thumb":"assets/works/tasty-nutrition/capa-grama.webp","hero":{"type":"image","src":"assets/works/tasty-nutrition/capa-grama.webp","mobile":"assets/works/tasty-nutrition/capa-grama-mobile.webp","alt":"Logotipo Tasty em creme sobre duas mulheres sorrindo deitadas na grama"},"blocks":[{"type":"statement","text":"Tudo já estava no nome."},{"type":"text","label":"Conceito","text":"Tasty não é uma palavra sobre performance, força ou superação. É uma palavra sobre prazer. A busca foi por uma marca que se pudesse sentir com a mão: com volume, com peso, com a maciez de uma superfície que cede quando apertada. Menos parecida com um símbolo e mais parecida com um alimento."},{"type":"image","src":"assets/works/tasty-nutrition/logotipo.svg","alt":"Logotipo Tasty em lettering creme dentro de um contêiner marrom-cacau de laterais côncavas, sobre fundo baunilha","ratio":"16:9","caption":"Logotipo"},{"type":"text","label":"Posicionamento","text":"Uma marca de suplementos premium, ancorada em saúde, bem-estar e lifestyle. Performance existe, mas não comanda a linguagem. O público prioritário são adultos a partir dos 35 anos, com rotina cheia, que já tentaram o que não conseguiram manter: para eles, sabor e praticidade pesam tanto quanto a fórmula."},{"type":"text","label":"Construção","text":"O contêiner nasce da interseção de círculos e elipses. As laterais côncavas e as pontas expandidas criam uma forma sob tensão, cheia no centro e comprimida nas bordas, como se fosse pressionada de fora para dentro. O lettering veio depois, sobre uma grade de linhas inclinadas, com gesto contínuo e terminais macios."},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/construcao-circulos.svg","alt":"Círculos e elipses que dão origem ao contêiner da marca","caption":"Círculos e elipses","ratio":"16:9"},{"src":"assets/works/tasty-nutrition/construcao-grade.svg","alt":"Grade de linhas inclinadas sobre a qual o lettering foi desenhado","caption":"Grade do lettering","ratio":"16:9"}]},{"type":"image","src":"assets/works/tasty-nutrition/versoes.webp","alt":"Logotipo Tasty sobre verde-hortelã, ameixa e cacau","ratio":"16:9","caption":"Versões de cor"},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/assinaturas.webp","alt":"Logotipo com os descritivos Nutrition e Health & Lifestyle","caption":"Assinaturas","ratio":"16:9"},{"src":"assets/works/tasty-nutrition/roxo.webp","alt":"Lettering Tasty com Nutrition, em creme sobre ameixa","caption":"Lettering","ratio":"16:9"}]},{"type":"text","label":"Cores","text":"A paleta nasce da despensa, não do laboratório. Hortelã, pistache e abacate ancoram a marca em verdes quentes, longe do verde clínico de farmácia, sobre uma base de baunilha. Ameixa, avelã, chocolate e cacau traduzem o que existe dentro do pote, e a folha de ouro, em filetes e detalhes, sustenta o premium."},{"type":"palette","items":[{"name":"Hortelã","hex":"#4A7A31"},{"name":"Pistache","hex":"#B9CF7C"},{"name":"Abacate","hex":"#1F3A1E"},{"name":"Ameixa","hex":"#73325A"},{"name":"Baunilha","hex":"#F6EDE1"},{"name":"Avelã","hex":"#C29A74"},{"name":"Chocolate","hex":"#5E3823"},{"name":"Cacau","hex":"#2A1A12"},{"name":"Folha de ouro","hex":"#C9AE70"}]},{"type":"statement","text":"Suplemento bom é o que a pessoa toma todo dia."},{"type":"text","label":"Tipografia","text":"Ranade nos títulos e destaques: geométrica, de terminais limpos, equilibra o gesto manual do lettering com uma estrutura racional. Instrument Sans no texto e na informação, da legenda à tabela nutricional. O lettering nunca vira fonte: ele é assinatura."},{"type":"text","label":"Sistema gráfico","text":"A forma que abriga o lettering também vive sozinha, como moldura, etiqueta ou recorte. Repetida em grade, vira o padrão da marca. E o script pode sangrar para fora da peça: como as letras são únicas, a Tasty continua reconhecível mesmo pela metade."},{"type":"image","src":"assets/works/tasty-nutrition/padrao.webp","alt":"Padrão verde formado pela forma do contêiner repetida em grade, sobre baunilha","ratio":"16:9","caption":"Padrão"},{"type":"image","src":"assets/works/tasty-nutrition/sangra.webp","alt":"Lettering Tasty em ameixa cortado nas bordas, ao lado de uma foto com garrafa ameixa e bola de tênis","ratio":"16:9","caption":"Lettering em sangramento"},{"type":"text","label":"Fotografia","text":"Pessoas reais, em movimento real, em situações do dia a dia. Rostos que expressam prazer e descanso, não esforço. Luz natural, céu, sombras suaves e alimento por perto; nada de interior de academia, pose de força ou fundo escuro."},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/pessoa-tapete.webp","alt":"Mulher sorrindo deitada em um tapete de yoga, com o pote de creatina Tasty sobre uma toalha verde","ratio":"auto"},{"src":"assets/works/tasty-nutrition/pessoa-grama.webp","alt":"Mulher sorrindo deitada na grama, de top roxo, com o lettering tasty vazado sobre o corpo","ratio":"auto"},{"src":"assets/works/tasty-nutrition/foto-garrafa.webp","alt":"Garrafa verde com o ícone da marca em uma quadra de tênis, com uma jogadora em movimento ao fundo","ratio":"auto"}]},{"type":"image","src":"assets/works/tasty-nutrition/campanha-suplemento.webp","alt":"Anúncio roxo com uma mão segurando uma cápsula e a frase “Suplemento bom é o que você repete”","ratio":"16:9"},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/story-haltere.webp","alt":"Story com um homem levantando um halter contra o céu e a frase “Comece o dia tasty”","ratio":"auto"},{"src":"assets/works/tasty-nutrition/story-nome.webp","alt":"Story verde com uma plaquinha pendurada: “A gente levou o nome a sério. Porque saúde também pode ser gostosa.”","ratio":"auto"},{"src":"assets/works/tasty-nutrition/story-yoga.webp","alt":"Story com uma mulher se alongando contra o céu e a frase “Comece o dia tasty” em roxo","ratio":"auto"}]},{"type":"image","src":"assets/works/tasty-nutrition/campanha-scoop.webp","alt":"Anúncio verde com a frase “Muito sabor em cada scoop” e um scoop derramando pó no formato da marca","ratio":"16:9"},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/campanha-tapetes.webp","alt":"Duas mulheres rindo com tapetes de yoga sob o lettering tasty em creme sobre um muro com céu azul","ratio":"auto"},{"src":"assets/works/tasty-nutrition/perfil.webp","alt":"Perfil da Tasty Nutrition em rede social, com a capa de maçãs verdes, o logotipo e o ícone da marca","ratio":"auto","caption":"Perfil nas redes"}]},{"type":"image","src":"assets/works/tasty-nutrition/macas.webp","alt":"Pote Tasty entre maçãs verdes e o selo Health, made tasty sobre verde","ratio":"16:9","caption":"Health, made tasty"},{"type":"pair","items":[{"src":"assets/works/tasty-nutrition/foto-grama.webp","alt":"Lettering tasty vazado sobre duas mulheres sorrindo deitadas na grama","ratio":"auto"},{"src":"assets/works/tasty-nutrition/foto-treino.webp","alt":"Homem sorrindo com regata verde e o ícone da marca no peito","ratio":"auto"}]},{"type":"image","src":"assets/works/tasty-nutrition/uniformes.webp","alt":"Camisa polo verde e regata preta com o logotipo Tasty, ao lado do lettering em relevo sobre baunilha","ratio":"16:9","caption":"Uniformes"},{"type":"text","label":"Embalagens","text":"No pote, o lettering ocupa a frente de ponta a ponta e é cortado pela curvatura, como o manual prevê. A cor muda com a linha, do hortelã à ameixa, sem quebrar a unidade, e o dourado fica no filete de acabamento."},{"type":"image","src":"assets/works/tasty-nutrition/potes.webp","alt":"Dois potes de creatina Tasty, um com lettering verde e outro ameixa","ratio":"16:9","caption":"Linha de creatina"},{"type":"image","src":"assets/works/tasty-nutrition/sacola.webp","alt":"Pessoa tirando um pote Tasty de uma ecobag e o mesmo pote entre maçãs verdes","ratio":"16:9","caption":"No dia a dia"},{"type":"image","src":"assets/works/tasty-nutrition/frascos.webp","alt":"Três frascos de cápsulas Tasty em verde-escuro, ameixa e verde-claro","ratio":"16:9","caption":"Cápsulas"},{"type":"image","src":"assets/works/tasty-nutrition/pote-ceu.webp","alt":"Pote de creatina Tasty com lettering verde ao lado de um copo d’água e um scoop, sobre um cubo verde e céu azul","ratio":"16:9","caption":"Pote de creatina"},{"type":"statement","text":"Marca boa é a que a pessoa reconhece sem precisar ler."}],"credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Intermediação","name":"SD Digital"}],"seo":{"title":"Tasty Nutrition — Identidade para suplementos","description":"Identidade visual e brandbook da Tasty Nutrition, marca premium de suplementos: lettering script em um contêiner macio e uma paleta que nasce da despensa."},"trail":["assets/works/tasty-nutrition/capa-grama.webp","assets/works/tasty-nutrition/pessoa-tapete.webp","assets/works/tasty-nutrition/pessoa-grama.webp","assets/works/tasty-nutrition/foto-garrafa.webp","assets/works/tasty-nutrition/foto-treino.webp","assets/works/tasty-nutrition/macas.webp","assets/works/tasty-nutrition/campanha-scoop.webp","assets/works/tasty-nutrition/pote-ceu.webp"]},{"slug":"karolinne-hartung","title":"Karolinne Hartung","tagline":"Psicanálise com propósito.","description":"Identidade visual e site para a psicanalista Karolinne Hartung, em Campinas (SP). Uma marca madura e acolhedora que foge do padrão clínico da área da saúde para abraçar o lado profundamente humano da psicanálise: logotipo serifado com ícone floral, monograma KH e uma paleta de tons quentes.","year":2026,"services":["Identidade visual","Web design"],"industry":"Psicanálise","location":"Campinas, SP","website":"https://www.karolinnehartung.com.br/","thumb":"assets/works/karolinne-hartung/capa.webp","hero":{"type":"image","src":"assets/works/karolinne-hartung/capa.webp","mobile":"assets/works/karolinne-hartung/capa-mobile.webp","alt":"Logotipo Karolinne Hartung em creme, com ícone floral, sobre fundo bordô"},"blocks":[{"type":"text","label":"Conceito","text":"A ideia é criar uma identidade visual madura, segura e que foge do tradicional padrão clínico para abraçar o lado profundamente humano da psicanálise."},{"type":"text","label":"Logotipo","text":"A logomarca de Karolinne Hartung une elegância e acolhimento através de uma tipografia serifada que mescla a estabilidade da fonte clássica com a fluidez orgânica do itálico, refletindo o próprio movimento do processo psicanalítico. O nome vai em romano e o sobrenome em itálico, com um ícone floral ao lado; “psicanalista” aparece em caixa-alta, sem serifa e com espaçamento aberto."},{"type":"image","src":"assets/works/karolinne-hartung/logotipo.webp","alt":"Logotipo Karolinne Hartung em bordô, com ícone floral e a legenda psicanalista, sobre fundo areia","ratio":"16:9","caption":"Logotipo"},{"type":"image","src":"assets/works/karolinne-hartung/versoes.webp","alt":"Três versões do logotipo em vertical: creme sobre bordô, bordô sobre branco e creme sobre verde-musgo","ratio":"16:9","caption":"Versões"},{"type":"pair","items":[{"src":"assets/works/karolinne-hartung/logo-musgo.webp","alt":"Logotipo horizontal em creme sobre fundo verde-musgo","ratio":"16:9"},{"src":"assets/works/karolinne-hartung/logo-terracota.webp","alt":"Logotipo empilhado em creme sobre fundo terracota","ratio":"16:9"}]},{"type":"text","label":"Cores","text":"A escolha desta paleta de cores foi pensada estrategicamente para fugir dos tons frios e excessivamente clínicos tradicionais da área da saúde. O objetivo é criar um ambiente visual que transmita, de forma imediata, acolhimento, profundidade e escuta ativa."},{"type":"palette","items":[{"name":"Sand","hex":"#EDE3D2"},{"name":"White","hex":"#FFFFFF"},{"name":"Deep Moss","hex":"#175C58"},{"name":"Terracotta","hex":"#9B5554"},{"name":"Bordeaux","hex":"#4E1122"}]},{"type":"text","label":"Ícones","text":"O despertar consciente da mente, o florescer do autoconhecimento e o resgate da fluidez na vida. Três ícones circulares dão forma a cada um desses movimentos."},{"type":"gallery","items":[{"src":"assets/works/karolinne-hartung/icone-despertar.svg","alt":"Ícone Despertar: círculo areia com uma forma de estrela em bordô","ratio":"1:1","caption":"Despertar"},{"src":"assets/works/karolinne-hartung/icone-florescer.svg","alt":"Ícone Florescer: círculo bordô com uma flor de pétalas em areia","ratio":"1:1","caption":"Florescer"},{"src":"assets/works/karolinne-hartung/icone-fluir.svg","alt":"Ícone Fluir: círculo bordô com um sol nascendo sobre linhas de campo","ratio":"1:1","caption":"Fluir"}]},{"type":"image","src":"assets/works/karolinne-hartung/padrao.webp","alt":"Padrão de flores em linha fina sobre fundo bordô","ratio":"16:9","caption":"Padrão"},{"type":"text","label":"Monograma","text":"O monograma “KH” foi criado para atuar como um selo de assinatura da marca, trazendo um ar de exclusividade, proximidade e alta costura para a identidade visual. Mais do que uma simples abreviação, ele atua como a assinatura íntima da marca, traduzindo visualmente a essência do processo psicanalítico. É ideal para aplicações mais delicadas, como avatares de redes sociais, carimbos, marcas d’água ou o rodapé do site."},{"type":"pair","items":[{"src":"assets/works/karolinne-hartung/monograma-areia.webp","alt":"Monograma KH em bordô, dentro de uma moldura oval, sobre fundo areia","ratio":"auto"},{"src":"assets/works/karolinne-hartung/monograma-terracota.webp","alt":"Monograma KH em creme, dentro de uma moldura oval, sobre fundo terracota","ratio":"auto"}]},{"type":"statement","text":"Acolhimento profundo para transformações reais."},{"type":"pair","items":[{"src":"assets/works/karolinne-hartung/retrato-sala.webp","alt":"Karolinne Hartung sentada em uma poltrona verde, em uma sala de paredes verde-musgo","ratio":"auto"},{"src":"assets/works/karolinne-hartung/retrato-janela.webp","alt":"Karolinne Hartung sentada ao lado de uma janela, com o logotipo no canto inferior","ratio":"auto"},{"src":"assets/works/karolinne-hartung/monograma-padrao.webp","alt":"Monograma KH em creme sobre o padrão de flores bordô","ratio":"auto"}]},{"type":"image","src":"assets/works/karolinne-hartung/mockup.webp","alt":"Logotipo Karolinne Hartung em relevo dourado sobre papel bordô texturizado","ratio":"16:9","caption":"Aplicação"},{"type":"text","label":"Site","text":"O site leva a identidade para o digital: a paleta quente, a tipografia serifada com itálicos de destaque e os três ícones — despertar, florescer e fluir — organizam a página, do convite inicial ao espaço de atendimento."},{"type":"image","src":"assets/works/karolinne-hartung/site-macbook.webp","alt":"Página inicial do site karolinnehartung.com.br em um MacBook, sobre fundo bordô","ratio":"16:9","caption":"Página inicial"},{"type":"video","src":"assets/works/karolinne-hartung/mobile.mp4","mobile":"assets/works/karolinne-hartung/mobile-vertical-v2.mp4","poster":"assets/works/karolinne-hartung/mobile-poster.webp","alt":"Três iPhones brancos sobre fundo bordô escuro mostrando o site: a página inicial rolando em vídeo, a seção de especialidades em tela clara e a citação sobre acolhimento","ratio":"16:9","caption":"Versão mobile"},{"type":"image","src":"assets/works/karolinne-hartung/site-secoes.webp","alt":"Duas seções do site em janelas de navegador sobrepostas, sobre fundo verde-musgo: o espaço de atendimento em bordô e o diferencial clínico em areia","ratio":"16:9","caption":"Seções"},{"type":"video","src":"assets/works/karolinne-hartung/contato.mp4","poster":"assets/works/karolinne-hartung/contato-poster.webp","alt":"Retratos em preto e branco de pessoas diversas, em grade sobre fundo areia, que surgem e trocam de lugar em animação contínua","ratio":"16:9","caption":"Contato"}],"credits":[{"role":"Design","name":"Nícolas de Queiróz"},{"role":"Intermediação","name":"SD Digital"}],"seo":{"title":"Karolinne Hartung — Marca para psicanalista","description":"Identidade visual e site da psicanalista Karolinne Hartung, em Campinas (SP): logotipo serifado com ícone floral, monograma KH e paleta de tons quentes."},"trail":["assets/works/karolinne-hartung/capa.webp","assets/works/karolinne-hartung/logo-musgo.webp","assets/works/karolinne-hartung/logo-terracota.webp","assets/works/karolinne-hartung/padrao.webp","assets/works/karolinne-hartung/monograma-terracota.webp","assets/works/karolinne-hartung/retrato-sala.webp","assets/works/karolinne-hartung/retrato-janela.webp","assets/works/karolinne-hartung/mockup.webp"]}]}</script>
