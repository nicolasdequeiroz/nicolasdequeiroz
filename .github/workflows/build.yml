name: Build site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - "css/**"
      - "js/**"
      - "index.html"
      - "sobre/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm run build

      - name: Commit generated work pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/ index.html sobre/index.html 404.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: rebuild pages [skip ci]"
          git push
